name = "ishiken-talk"
main = "src/index.js"
compatibility_date = "2026-11-01"

# 会話回数・部員パス・推しの記録を置く場所（作成後に id を書き込む）
[[kv_namespaces]]
binding = "KV"
id = "ac7dc379fbe94c2498a58925fae5ffed"

# 秘密の値はファイルに書かず、次のコマンドで登録する（アッキーが実行）
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put WEBHOOK_SECRET
#   npx wrangler secret put ELEVENLABS_API_KEY   （キャラの声）
#   npx wrangler secret put REVENUECAT_SECRET    （部員パスの確認。RevenueCat の秘密キー sk_...）

# アプリのWeb版（iPhoneのSafariで試す用）。ファイルに無いパスは上の中継サーバーが受け取る
[assets]
directory = "./public"

[vars]
# 部員パスでない人が声を試せる回数（1日）
TTS_TRIAL = "3"
